schema: 1
kind: dag
name: authoring-draft
goal: Review the declared decoder and storage scopes without changing source
criteria:
  standards: All selected implementation, caller and test ranges receive documented-rule assessment
  correctness: All selected implementation, caller and test ranges receive reachable-failure assessment
  simplicity: All selected application ranges receive a contract-preserving simplicity assessment
  test-value: All selected tests and implementation context receive a behavioral-protection assessment
  consolidation: Preserve every original finding, coverage status and separate aspect assessment
context: |
  Synthetic authoring input only. Do not execute against this repository.
  Decoder header/body share dispatch.ts and the decode-input requirement.
  Storage opening and transaction handling share storage-lifecycle but have distinct failure/cleanup scenarios.
  Group each aspect by coherent responsibility and reasoning demands. Line totals include documents and inform attention review, not automatic splitting.
  Standards assesses rules, correctness reachable failures, simplicity application structure without test bodies,
  and test-value behavioral protection with implementation/caller context and pruning guidance.
  Every agent writes its named artifacts and outcome.json/handoff.md in the supplied artifacts directory.
  Controls contain outcome (claimed-complete|blocked|failed), summary, deliverables,
  evidence [{criterion,paths}], findings [{summary,evidence,needsAuthor}].
  Call validate_submission after writing all outputs and controls.
  Reports include exact inspected scope/status, requirement coverage, stable finding IDs, aspect,
  precise locations, evidence, impact, recommendation and gaps or explicit no-findings.
  Missing evidence is blocked/inconclusive; code defects are normal findings.
  No project writes, commands, delegation, installations, model calls or scope expansion.
defaults: { profile: large, skills: [] }
review: { profile: large }
limits: { concurrency: 4, nodeRetries: 0, repairCycles: 0 }
nodes:
  standards--decode-header:
    kind: agent
    profile: small
    references:
      [
        "src/decode/header.ts",
        "tests/decode/header.test.ts",
        "src/decode/dispatch.ts",
        "AGENTS.md",
      ]
    write: []
    satisfies: [standards]
    outputs: [report.json]
    task: |
      Assess standards only. Responsibility: decode-header; requirement: decode-input.
      Inspect only src/decode/header.ts:1-180, tests/decode/header.test.ts:1-260, src/decode/dispatch.ts:1-100, AGENTS.md:1-40.
      Write report.json using the shared report contract. Exclude other aspects and source.
      Finish with controls and validate_submission; unavailable required evidence is blocked/inconclusive.
